[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "core-deepinfer"
version = "0.1.0"
description = "A readable NumPy inference loop: prefill, cached decoding, speculative rollback and bilingual guides"
readme = "README_PYPI.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Yufeng He"}]
dependencies = ["numpy>=1.24"]
keywords = ["inference", "deepinfer", "kv-cache", "speculative-decoding", "education"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9", "build>=1.2"]

[project.scripts]
core-deepinfer = "core_deepinfer.cli:main"

[project.urls]
"Source readings" = "https://github.com/he-yufeng/ai-infra-notes"
"Upstream DeepInfer" = "https://github.com/deepseek-ai/DeepInfer"

[tool.hatch.build.targets.wheel]
packages = ["core_deepinfer"]
core-metadata-version = "2.4"

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"
include = ["/core_deepinfer", "/tests", "/docs", "/examples", "/assets", "/README.md", "/README_CN.md", "/README_PYPI.md", "/LICENSE", "/pyproject.toml", "/.github/workflows/tests.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
