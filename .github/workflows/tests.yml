name: CPU reference checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest -q
      - run: python -m core_deepinfer all --json
      - run: python -m core_deepinfer demo --trace --json
      - run: python examples/engine_batch.py
      - run: python -m core_deepinfer generate --input examples/requests.json --json
      - run: python -m build
      - name: Check installed wheel outside the checkout
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cd "${RUNNER_TEMP}"
          python -I -m core_deepinfer demo --json
          core-deepinfer generate --prompt 1,2,3 --max-tokens 4 --json
          core-deepinfer guide --list --json
          core-deepinfer guide 03 --lang zh
